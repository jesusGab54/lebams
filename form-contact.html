	<main id="main">
		<section class="contact" aria-labelledby="contact-title">
			<h1 class="subtitle" id="contact-title">Formulario de Contacto</h1>
			<p class="contact__lead">Cuéntanos qué prenda necesitas arreglar o confeccionar y te responderemos lo antes posible.</p>

			<form class="form-contact" id="contact-form" action="https://formsubmit.co/lebams@gmail.com" method="POST" data-ajax-endpoint="https://formsubmit.co/ajax/lebams@gmail.com" autocomplete="on">
				<div class="form-row">
					<div class="float-field">
						<input type="text" id="name" name="name" placeholder=" " autocomplete="given-name" maxlength="60" required>
						<label for="name">Nombres</label>
					</div>
					<div class="float-field">
						<input type="text" id="last-name" name="last-name" placeholder=" " autocomplete="family-name" maxlength="60" required>
						<label for="last-name">Apellidos</label>
					</div>
				</div>
				<div class="form-row">
					<div class="float-field">
						<input type="tel" id="phone" name="phone" placeholder=" " autocomplete="tel" inputmode="tel" pattern="[0-9+()\s\-]{7,20}" title="Solo números, espacios, +, - y paréntesis (7 a 20 caracteres)" maxlength="20" required>
						<label for="phone">Teléfono</label>
					</div>
					<div class="float-field">
						<input type="email" id="email" name="email" placeholder=" " autocomplete="email" maxlength="120" required>
						<label for="email">Correo</label>
					</div>
				</div>
				<div class="form-row form-row--single">
					<div class="float-field">
						<textarea id="message" name="message" placeholder=" " minlength="10" maxlength="1500" rows="6" required></textarea>
						<label for="message">Mensaje</label>
					</div>
				</div>

				<!-- Configuración FormSubmit + campo trampa anti-spam -->
				<input type="hidden" name="_subject" value="Nuevo mensaje desde el sitio web de Lebams">
				<input type="hidden" name="_template" value="table">
				<input type="hidden" name="_captcha" value="false">
				<div class="hp-field" aria-hidden="true">
					<label for="website">No rellenar</label>
					<input type="text" id="website" name="_honey" tabindex="-1" autocomplete="off">
				</div>

				<div class="form-actions">
					<button type="submit" class="btn btn--accent">Enviar mensaje</button>
					<p class="form-status" role="status" aria-live="polite"></p>
					<a class="contact__back" href="index.html">&larr; Volver al inicio</a>
				</div>
			</form>

			<a class="btn btn--light" href="https://wa.me/584147180941" target="_blank" rel="noopener noreferrer"><svg class="icon" aria-hidden="true"><use href="#i-whatsapp"/></svg>¿Prefieres WhatsApp?</a>
		</section>
